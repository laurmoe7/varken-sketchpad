name: Build the desktop app (Windows)

# Runs by itself whenever the page or the desktop shell changes on main, and by hand:
# Actions > "Build the desktop app (Windows)" > Run workflow.
# It publishes a release with the installer. Installed copies find the newest release and update themselves,
# so you only run the installer yourself the first time.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'index.html'
      - 'sketch.js'
      - 'sketch.css'
      - 'game/**'
      - 'package.json'
      - 'build/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # each run gets a higher version, which is how installed copies know there is something newer
      - run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version
      - run: npm run dist
      # one step makes the release and attaches everything (the installer, its block map and latest.yml, which installed copies read to find updates)
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          ls dist
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" dist/Varken-Sketchpad-Setup-*.exe dist/*.blockmap dist/latest.yml --clobber
          else
            gh release create "v$VER" dist/Varken-Sketchpad-Setup-*.exe dist/*.blockmap dist/latest.yml --target "$GITHUB_SHA" --title "$VER" --notes "Varken Sketchpad for Windows $VER"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Varken-Sketchpad-installer
          path: dist/*.exe
